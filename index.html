<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>幸运扭蛋机</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
    .container { text-align: center; max-width: 420px; width: 100%; }
    h1 { font-size: 32px; color: white; margin-bottom: 8px; text-shadow: 0 2px 10px rgba(0,0,0,0.2); }
    .subtitle { color: rgba(255,255,255,0.8); font-size: 14px; margin-bottom: 30px; }
    .machine { position: relative; width: 300px; height: 420px; margin: 0 auto; }
    .dome { width: 260px; height: 200px; background: linear-gradient(135deg, rgba(255,255,255,0.9), rgba(255,255,255,0.6)); border-radius: 130px 130px 0 0; margin: 0 auto; position: relative; overflow: hidden; border: 4px solid rgba(255,255,255,0.5); backdrop-filter: blur(10px); }
    .capsule { position: absolute; width: 36px; height: 36px; border-radius: 50%; animation: floatCapsule 3s ease-in-out infinite; }
    .capsule::before { content: ''; position: absolute; top: 50%; left: 0; right: 0; height: 2px; background: rgba(255,255,255,0.6); transform: translateY(-50%); }
    @keyframes floatCapsule { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-5px) rotate(5deg); } }
    .body { width: 280px; height: 220px; background: linear-gradient(180deg, #ff6b6b, #ee5a5a); border-radius: 0 0 20px 20px; margin: 0 auto; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
    .body::before { content: ''; position: absolute; top: -10px; left: 10px; right: 10px; height: 20px; background: #e05656; border-radius: 10px 10px 0 0; }
    .slot { position: absolute; top: 30px; left: 50%; transform: translateX(-50%); width: 80px; height: 70px; background: linear-gradient(180deg, #333, #555); border-radius: 0 0 15px 15px; overflow: hidden; }
    .slot-door { width: 100%; height: 100%; background: #444; transition: transform 0.3s; }
    .slot-door.open { transform: translateY(-100%); }
    .dropped-capsule { position: absolute; width: 50px; height: 50px; border-radius: 50%; top: -60px; left: 50%; transform: translateX(-50%); transition: top 0.5s ease-in; z-index: 5; }
    .dropped-capsule.drop { top: 10px; }
    .knob-container { position: absolute; right: -20px; top: 80px; cursor: pointer; z-index: 10; }
    .knob { width: 60px; height: 60px; background: linear-gradient(135deg, #f1c40f, #f39c12); border-radius: 50%; position: relative; box-shadow: 0 4px 10px rgba(0,0,0,0.3); transition: transform 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55); }
    .knob::after { content: '🔄'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 24px; }
    .knob.spin { animation: knobSpin 0.5s ease-in-out; }
    @keyframes knobSpin { 0% { transform: rotate(0deg); } 25% { transform: rotate(-30deg); } 100% { transform: rotate(360deg); } }
    .knob-label { position: absolute; bottom: -25px; left: 50%; transform: translateX(-50%); font-size: 11px; color: #fff; white-space: nowrap; background: rgba(0,0,0,0.3); padding: 2px 8px; border-radius: 10px; }
    .base { width: 200px; height: 30px; background: #c0392b; margin: 0 auto; border-radius: 0 0 15px 15px; position: relative; top: -5px; }
    .twist-btn { background: linear-gradient(135deg, #f1c40f, #f39c12); color: #333; border: none; padding: 16px 50px; font-size: 20px; font-weight: bold; border-radius: 50px; cursor: pointer; box-shadow: 0 6px 20px rgba(241, 196, 15, 0.4); transition: transform 0.2s, box-shadow 0.2s; margin-top: 30px; }
    .twist-btn:hover { transform: scale(1.05); box-shadow: 0 8px 25px rgba(241, 196, 15, 0.5); }
    .twist-btn:disabled { background: #ccc; box-shadow: none; cursor: not-allowed; transform: none; }
    .prize-list { margin-top: 25px; text-align: left; padding: 15px; background: rgba(255,255,255,0.95); border-radius: 12px; }
    .prize-list h3 { font-size: 14px; color: #666; margin-bottom: 10px; }
    .prize-item { display: flex; justify-content: space-between; padding: 6px 0; font-size: 13px; border-bottom: 1px dashed #eee; }
    .prize-item:last-child { border-bottom: none; }
    .prize-chance { color: #e74c3c; font-weight: bold; }
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: center; z-index: 100; padding: 20px; }
    .modal-overlay.active { display: flex; }
    .modal { background: white; border-radius: 24px; padding: 40px 30px; max-width: 360px; width: 100%; text-align: center; animation: modalPop 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55); }
    @keyframes modalPop { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    .capsule-open { font-size: 80px; margin-bottom: 15px; animation: capsuleShake 0.6s ease-in-out; }
    @keyframes capsuleShake { 0%, 100% { transform: rotate(0deg); } 25% { transform: rotate(-10deg); } 75% { transform: rotate(10deg); } }
    .modal-title { font-size: 24px; color: #c0392b; margin-bottom: 10px; }
    .modal-prize { font-size: 28px; font-weight: bold; color: #e74c3c; margin-bottom: 8px; }
    .modal-desc { color: #888; font-size: 14px; margin-bottom: 25px; }
    .modal-btn { background: linear-gradient(135deg, #e74c3c, #c0392b); color: white; border: none; padding: 14px 40px; font-size: 16px; font-weight: bold; border-radius: 50px; cursor: pointer; width: 100%; }
    .already-drawn { display: none; padding: 40px 20px; background: rgba(255,255,255,0.95); border-radius: 24px; }
    .already-drawn.active { display: block; }
    .game-section.hidden { display: none; }
    .footer { margin-top: 20px; font-size: 11px; color: rgba(255,255,255,0.6); }
    .confetti { position: fixed; width: 10px; height: 10px; top: -10px; z-index: 99; animation: confettiFall 3s linear forwards; }
    @keyframes confettiFall { to { transform: translateY(100vh) rotate(720deg); opacity: 0; } }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎰 幸运扭蛋机</h1>
    <p class="subtitle">转动旋钮，抽取你的幸运奖品！</p>
    <div class="game-section" id="gameSection">
      <div class="machine">
        <div class="dome" id="dome"></div>
        <div class="body">
          <div class="slot"><div class="slot-door" id="slotDoor"></div><div class="dropped-capsule" id="droppedCapsule"></div></div>
          <div class="knob-container" onclick="twist()"><div class="knob" id="knob"></div><div class="knob-label">转动我</div></div>
        </div>
        <div class="base"></div>
      </div>
      <button class="twist-btn" id="twistBtn">转动扭蛋机</button>
      <div class="prize-list"><h3>🏆 奖品列表</h3><div class="prize-item"><span>特等奖 - iPhone 16 Pro</span><span class="prize-chance">1%</span></div><div class="prize-item"><span>一等奖 - iPad Air</span><span class="prize-chance">3%</span></div><div class="prize-item"><span>二等奖 - AirPods Pro</span><span class="prize-chance">6%</span></div><div class="prize-item"><span>三等奖 - 小米手环</span><span class="prize-chance">10%</span></div><div class="prize-item"><span>四等奖 - 50元红包</span><span class="prize-chance">15%</span></div><div class="prize-item"><span>五等奖 - 10元红包</span><span class="prize-chance">25%</span></div><div class="prize-item"><span>幸运奖 - 谢谢参与</span><span class="prize-chance">40%</span></div></div>
    </div>
    <div class="already-drawn" id="alreadyDrawn"><div style="font-size: 60px; margin-bottom: 15px;">🎊</div><h2 style="color: #c0392b; margin-bottom: 10px;">您已扭过啦</h2><p style="color: #888; font-size: 14px;">每人仅限一次机会，看看你抽中了什么吧！</p><div id="myPrize" style="margin-top: 20px; padding: 15px; background: #fff3cd; border-radius: 12px;"><div style="font-size: 13px; color: #856404;">你的扭蛋里是</div><div style="font-size: 22px; font-weight: bold; color: #e74c3c;" id="myPrizeText"></div></div></div>
    <div class="footer">活动最终解释权归主办方所有</div>
  </div>
  <div class="modal-overlay" id="modalOverlay"><div class="modal"><div class="capsule-open" id="capsuleOpen">🥚</div><div class="modal-title" id="modalTitle">打开扭蛋…</div><div class="modal-prize" id="modalPrize"></div><div class="modal-desc" id="modalDesc"></div><button class="modal-btn" onclick="closeModal()">收下奖品</button></div></div>
  <script>
    const prizes = [{name:'iPhone 16 Pro',level:'特等奖',probability:1,color:'#e74c3c',icon:'📱'},{name:'iPad Air',level:'一等奖',probability:3,color:'#e67e22',icon:'📲'},{name:'AirPods Pro',level:'二等奖',probability:6,color:'#f1c40f',icon:'🎧'},{name:'小米手环',level:'三等奖',probability:10,color:'#2ecc71',icon:'⌚'},{name:'50元红包',level:'四等奖',probability:15,color:'#3498db',icon:'🧧'},{name:'10元红包',level:'五等奖',probability:25,color:'#9b59b6',icon:'🧧'},{name:'谢谢参与',level:'幸运奖',probability:40,color:'#95a5a6',icon:'😅'}];
    const capsuleColors = ['#e74c3c','#e67e22','#f1c40f','#2ecc71','#3498db','#9b59b6','#1abc9c'];
    let isTwisting = false;
    function fillDome(){const dome=document.getElementById('dome');const positions=[{top:20,left:30},{top:25,left:60},{top:30,left:90},{top:40,left:40},{top:45,left:75},{top:50,left:110},{top:60,left:25},{top:65,left:55},{top:70,left:90},{top:80,left:35},{top:85,left:70},{top:90,left:105},{top:100,left:45},{top:110,left:80},{top:120,left:30},{top:125,left:65},{top:130,left:100},{top:140,left:50},{top:150,left:85},{top:160,left:40}];positions.forEach((pos,i)=>{const cap=document.createElement('div');cap.className='capsule';cap.style.background=`linear-gradient(135deg, ${capsuleColors[i%capsuleColors.length]}, ${adjustColor(capsuleColors[i%capsuleColors.length],-20)})`;cap.style.left=pos.left+'px';cap.style.top=pos.top+'px';cap.style.animationDelay=(i*0.15)+'s';cap.style.opacity=0.8;dome.appendChild(cap);});}
    function adjustColor(hex,amount){const num=parseInt(hex.replace('#',''),16);const r=Math.max(0,Math.min(255,(num>>16)+amount));const g=Math.max(0,Math.min(255,((num>>8)&0x00FF)+amount));const b=Math.max(0,Math.min(255,(num&0x0000FF)+amount));return'#'+(1<<24|r<<16|g<<8|b).toString(16).slice(1);}
    function drawPrize(){const rand=Math.random()*100;let cumulative=0;for(let i=0;i<prizes.length;i++){cumulative+=prizes[i].probability;if(rand<=cumulative)return i;}return prizes.length-1;}
    function twist(){if(isTwisting)return;if(localStorage.getItem('hasDrawn')){showAlreadyDrawn();return;}isTwisting=true;document.getElementById('twistBtn').disabled=true;const knob=document.getElementById('knob');knob.classList.add('spin');setTimeout(()=>{knob.classList.remove('spin');const dropped=document.getElementById('droppedCapsule');const resultIndex=drawPrize();dropped.style.background=`linear-gradient(135deg, ${capsuleColors[resultIndex%capsuleColors.length]}, ${adjustColor(capsuleColors[resultIndex%capsuleColors.length],-20)})`;dropped.classList.add('drop');setTimeout(()=>{document.getElementById('slotDoor').classList.add('open');setTimeout(()=>{showResult(resultIndex);localStorage.setItem('hasDrawn','true');localStorage.setItem('myPrize',JSON.stringify(prizes[resultIndex]));},800);},600);},500);}
    function showResult(index){const prize=prizes[index];document.getElementById('capsuleOpen').textContent='🥚';document.getElementById('modalPrize').textContent=prize.icon+' '+prize.name;document.getElementById('modalTitle').textContent=prize.name==='谢谢参与'?'哎呀～':'🎊 恭喜！';document.getElementById('modalDesc').textContent=prize.name==='谢谢参与'?'别灰心，下次好运！':'请凭此页面联系工作人员领奖！';document.getElementById('modalOverlay').classList.add('active');setTimeout(()=>{document.getElementById('capsuleOpen').textContent=prize.icon;document.getElementById('capsuleOpen').className='capsule-open';void document.getElementById('capsuleOpen').offsetWidth;},300);if(prize.name!=='谢谢参与'){createConfetti();}}
    function closeModal(){document.getElementById('modalOverlay').classList.remove('active');showAlreadyDrawn();}
    function showAlreadyDrawn(){const saved=localStorage.getItem('myPrize');if(saved){const prize=JSON.parse(saved);document.getElementById('myPrizeText').textContent=prize.icon+' '+prize.name;}document.getElementById('gameSection').classList.add('hidden');document.getElementById('alreadyDrawn').classList.add('active');}
    function createConfetti(){const colors=['#e74c3c','#f1c40f','#2ecc71','#3498db','#9b59b6','#e67e22'];for(let i=0;i<60;i++){setTimeout(()=>{const confetti=document.createElement('div');confetti.className='confetti';confetti.style.left=Math.random()*100+'vw';confetti.style.background=colors[Math.floor(Math.random()*colors.length)];confetti.style.animationDuration=(Math.random()*2+2)+'s';confetti.style.borderRadius=Math.random()>0.5?'50%':'0';document.body.appendChild(confetti);setTimeout(()=>confetti.remove(),4000);},i*30);}}
    document.addEventListener('DOMContentLoaded',()=>{fillDome();document.getElementById('twistBtn').addEventListener('click',twist);if(localStorage.getItem('hasDrawn')){showAlreadyDrawn();}});
  </script>
</body>
</html>
