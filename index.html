<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>幸运扭蛋机</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}.container{text-align:center;max-width:420px;width:100%}h1{font-size:32px;color:#fff;margin-bottom:8px;text-shadow:0 2px 10px rgba(0,0,0,.2)}.subtitle{color:rgba(255,255,255,.8);font-size:14px;margin-bottom:30px}.machine{position:relative;width:300px;height:440px;margin:0 auto}.dome{width:260px;height:200px;background:linear-gradient(135deg,rgba(255,255,255,.9),rgba(255,255,255,.5));border-radius:130px 130px 0 0;margin:0 auto;position:relative;overflow:hidden;border:4px solid rgba(255,255,255,.6);backdrop-filter:blur(10px);box-shadow:inset 0 -10px 30px rgba(0,0,0,.1)}.capsule{position:absolute;width:36px;height:36px;border-radius:50%;animation:floatCapsule 3s ease-in-out infinite;box-shadow:inset -3px -3px 8px rgba(0,0,0,.15),2px 2px 5px rgba(0,0,0,.1)}.capsule::before{content:'';position:absolute;top:50%;left:5%;right:5%;height:2px;background:rgba(255,255,255,.7);transform:translateY(-50%)}.capsule::after{content:'';position:absolute;top:8px;left:10px;width:8px;height:5px;border-radius:50%;background:rgba(255,255,255,.4)}@keyframes floatCapsule{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-6px) rotate(4deg)}}.body{width:280px;height:230px;background:linear-gradient(180deg,#ff6b6b 0%,#ee5a5a 60%,#dc4a4a 100%);border-radius:0 0 20px 20px;margin:0 auto;position:relative;box-shadow:0 10px 30px rgba(0,0,0,.25)}.body::before{content:'';position:absolute;top:-12px;left:8px;right:8px;height:20px;background:#e05656;border-radius:12px 12px 0 0}.body::after{content:'🎁';position:absolute;bottom:30px;left:50%;transform:translateX(-50%);font-size:40px;opacity:.3}.slot{position:absolute;top:25px;left:50%;transform:translateX(-50%);width:90px;height:80px;background:linear-gradient(180deg,#2c2c2c,#4a4a4a);border-radius:0 0 18px 18px;overflow:hidden;border:3px solid #1a1a1a}.slot-door{width:100%;height:100%;background:#3d3d3d;transition:transform .4s cubic-bezier(.68,-.55,.265,1.55)}.slot-door.open{transform:translateY(-100%)}.dropped-capsule{position:absolute;width:54px;height:54px;border-radius:50%;top:-65px;left:50%;transform:translateX(-50%);transition:top .5s cubic-bezier(.6,-.28,.735,.045);z-index:5;box-shadow:inset -4px -4px 10px rgba(0,0,0,.2),2px 2px 6px rgba(0,0,0,.2)}.dropped-capsule::before{content:'';position:absolute;top:50%;left:5%;right:5%;height:3px;background:rgba(255,255,255,.6);transform:translateY(-50%)}.dropped-capsule.drop{top:12px}.knob-container{position:absolute;right:-25px;top:90px;cursor:pointer;z-index:10;-webkit-tap-highlight-color:transparent}.knob{width:60px;height:60px;background:linear-gradient(135deg,#f9e79f 0%,#f1c40f 50%,#f39c12 100%);border-radius:50%;position:relative;box-shadow:0 4px 12px rgba(0,0,0,.3),inset 0 -3px 8px rgba(0,0,0,.1);transition:transform .3s}.knob::before{content:'';position:absolute;top:8px;left:50%;transform:translateX(-50%);width:4px;height:12px;background:rgba(0,0,0,.2);border-radius:2px}.knob::after{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:20px;height:20px;background:linear-gradient(135deg,#f1c40f,#e67e22);border-radius:50%;box-shadow:inset 0 -2px 4px rgba(0,0,0,.15)}.knob.spin{animation:knobSpin .6s cubic-bezier(.68,-.55,.265,1.55)}@keyframes knobSpin{0%{transform:rotate(0deg)}25%{transform:rotate(-45deg)}100%{transform:rotate(400deg)}}.knob-label{position:absolute;bottom:-25px;left:50%;transform:translateX(-50%);font-size:11px;color:#fff;white-space:nowrap;background:rgba(0,0,0,.25);padding:3px 10px;border-radius:10px;font-weight:500}.base{width:220px;height:35px;background:linear-gradient(180deg,#c0392b,#a93226);margin:0 auto;border-radius:0 0 18px 18px;position:relative;top:-5px;box-shadow:0 5px 15px rgba(0,0,0,.2)}.base::before{content:'';position:absolute;bottom:5px;left:20px;right:20px;height:4px;background:rgba(0,0,0,.15);border-radius:2px}.twist-btn{background:linear-gradient(135deg,#f1c40f,#f39c12);color:#333;border:none;padding:16px 50px;font-size:20px;font-weight:700;border-radius:50px;cursor:pointer;box-shadow:0 6px 20px rgba(241,196,15,.4);transition:transform .2s,box-shadow .2s;margin-top:30px}.twist-btn:hover{transform:scale(1.05);box-shadow:0 8px 25px rgba(241,196,15,.5)}.twist-btn:active{transform:scale(.98)}.twist-btn:disabled{background:#ccc;box-shadow:none;cursor:not-allowed;transform:none}.prize-list{margin-top:25px;text-align:left;padding:18px;background:rgba(255,255,255,.95);border-radius:16px;box-shadow:0 4px 15px rgba(0,0,0,.1)}.prize-list h3{font-size:14px;color:#666;margin-bottom:12px}.prize-item{display:flex;justify-content:space-between;padding:7px 0;font-size:13px;border-bottom:1px dashed #eee}.prize-item:last-child{border-bottom:none}.prize-chance{color:#e74c3c;font-weight:700}.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);display:none;justify-content:center;align-items:center;z-index:100;padding:20px;backdrop-filter:blur(4px)}.modal-overlay.active{display:flex;animation:fadeIn .3s}@keyframes fadeIn{from{opacity:0}to{opacity:1}}.modal{background:#fff;border-radius:28px;padding:40px 30px;max-width:360px;width:100%;text-align:center;animation:modalPop .5s cubic-bezier(.68,-.55,.265,1.55);box-shadow:0 20px 60px rgba(0,0,0,.3)}@keyframes modalPop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}.capsule-big{font-size:90px;margin-bottom:15px;display:inline-block;animation:capsuleShake .6s ease-in-out}@keyframes capsuleShake{0%,100%{transform:rotate(0deg) scale(1)}20%{transform:rotate(-12deg) scale(1.05)}40%{transform:rotate(10deg) scale(.95)}60%{transform:rotate(-8deg) scale(1.02)}80%{transform:rotate(6deg) scale(.98)}}.capsule-big.open{animation:capsuleOpen .5s forwards}@keyframes capsuleOpen{0%{transform:scale(1);opacity:1}50%{transform:scale(1.3);opacity:.8}100%{transform:scale(0);opacity:0}}.prize-reveal{font-size:70px;animation:prizeAppear .4s cubic-bezier(.68,-.55,.265,1.55);display:inline-block}@keyframes prizeAppear{0%{transform:scale(0) rotate(-180deg);opacity:0}100%{transform:scale(1) rotate(0deg);opacity:1}}.modal-title{font-size:24px;color:#c0392b;margin-bottom:8px}.modal-prize{font-size:26px;font-weight:700;color:#e74c3c;margin-bottom:6px}.modal-desc{color:#888;font-size:14px;margin-bottom:25px;line-height:1.5}.modal-btn{background:linear-gradient(135deg,#e74c3c,#c0392b);color:#fff;border:none;padding:14px 40px;font-size:16px;font-weight:700;border-radius:50px;cursor:pointer;width:100%;box-shadow:0 4px 15px rgba(231,76,60,.3);transition:transform .2s}.modal-btn:hover{transform:scale(1.03)}.already-drawn{display:none;padding:40px 20px;background:rgba(255,255,255,.95);border-radius:24px;box-shadow:0 10px 30px rgba(0,0,0,.15)}.already-drawn.active{display:block;animation:fadeIn .4s}.game-section.hidden{display:none}.footer{margin-top:20px;font-size:11px;color:rgba(255,255,255,.6)}.confetti{position:fixed;width:10px;height:10px;top:-10px;z-index:99;animation:confettiFall 3s linear forwards}@keyframes confettiFall{to{transform:translateY(100vh) rotate(720deg);opacity:0}}.machine.shake{animation:machineShake .5s ease-in-out}@keyframes machineShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px) rotate(-1deg)}40%{transform:translateX(5px) rotate(1deg)}60%{transform:translateX(-4px) rotate(-1deg)}80%{transform:translateX(4px) rotate(1deg)}}
  </style>
</head>
<body>
  <div class="container">
    <h1>🎰 幸运扭蛋机</h1>
    <p class="subtitle">转动旋钮，抽取你的幸运奖品！</p>
    <div class="game-section" id="gameSection">
      <div class="machine" id="machine">
        <div class="dome" id="dome"></div>
        <div class="body">
          <div class="slot"><div class="slot-door" id="slotDoor"></div><div class="dropped-capsule" id="droppedCapsule"></div></div>
          <div class="knob-container" onclick="twist()"><div class="knob" id="knob"></div><div class="knob-label">转动我</div></div>
        </div>
        <div class="base"></div>
      </div>
      <button class="twist-btn" id="twistBtn">转动扭蛋机</button>
      <div class="prize-list"><h3>🏆 奖品列表</h3><div class="prize-item"><span>特等奖 - iPhone 16 Pro</span><span class="prize-chance">1%</span></div><div class="prize-item"><span>一等奖 - iPad Air</span><span class="prize-chance">3%</span></div><div class="prize-item"><span>二等奖 - AirPods Pro</span><span class="prize-chance">6%</span></div><div class="prize-item"><span>三等奖 - 小米手环</span><span class="prize-chance">10%</span></div><div class="prize-item"><span>四等奖 - 50元红包</span><span class="prize-chance">15%</span></div><div class="prize-item"><span>五等奖 - 10元红包</span><span class="prize-chance">25%</span></div><div class="prize-item"><span>幸运奖 - 谢谢参与</span><span class="prize-chance">40%</span></div></div>
    </div>
    <div class="already-drawn" id="alreadyDrawn"><div style="font-size:60px;margin-bottom:15px">🎊</div><h2 style="color:#c0392b;margin-bottom:10px">您已扭过啦</h2><p style="color:#888;font-size:14px;margin-bottom:20px">每人仅限一次机会，看看你抽中了什么吧！</p><div id="myPrize" style="padding:20px;background:linear-gradient(135deg,#fff9e6,#fff3cd);border-radius:16px;border:2px solid #f1c40f"><div style="font-size:13px;color:#856404;margin-bottom:8px">你的扭蛋里是</div><div style="font-size:28px;font-weight:700;color:#e74c3c" id="myPrizeText"></div></div></div>
    <div class="footer">活动最终解释权归主办方所有</div>
  </div>
  <div class="modal-overlay" id="modalOverlay"><div class="modal"><div id="capsuleStage"><div class="capsule-big" id="capsuleBig">🥚</div></div><div class="modal-title" id="modalTitle">打开扭蛋…</div><div class="modal-prize" id="modalPrize"></div><div class="modal-desc" id="modalDesc"></div><button class="modal-btn" onclick="closeModal()">收下奖品</button></div></div>
  <script>
    const prizes=[{name:'iPhone 16 Pro',level:'特等奖',probability:1,color:'#e74c3c',icon:'📱'},{name:'iPad Air',level:'一等奖',probability:3,color:'#e67e22',icon:'📲'},{name:'AirPods Pro',level:'二等奖',probability:6,color:'#f1c40f',icon:'🎧'},{name:'小米手环',level:'三等奖',probability:10,color:'#2ecc71',icon:'⌚'},{name:'50元红包',level:'四等奖',probability:15,color:'#3498db',icon:'🧧'},{name:'10元红包',level:'五等奖',probability:25,color:'#9b59b6',icon:'🧧'},{name:'谢谢参与',level:'幸运奖',probability:40,color:'#95a5a6',icon:'😅'}];const capsuleColors=['#e74c3c','#e67e22','#f1c40f','#2ecc71','#3498db','#9b59b6','#1abc9c'];let isTwisting=!1;function fillDome(){const e=document.getElementById('dome'),t=[{top:18,left:25},{top:22,left:55},{top:26,left:85},{top:30,left:115},{top:40,left:35},{top:44,left:65},{top:48,left:95},{top:52,left:125},{top:62,left:28},{top:66,left:58},{top:70,left:88},{top:74,left:118},{top:86,left:38},{top:90,left:68},{top:94,left:98},{top:98,left:128},{top:112,left:30},{top:118,left:62},{top:124,left:94},{top:130,left:126},{top:145,left:40},{top:150,left:75},{top:155,left:110},{top:168,left:55},{top:172,left:95}];t.forEach((t,s)=>{const n=document.createElement('div');n.className='capsule';const i=s%capsuleColors.length;n.style.background=`linear-gradient(135deg, ${capsuleColors[i]}, ${darkenColor(capsuleColors[i],20)})`,n.style.left=t.left+'px',n.style.top=t.top+'px',n.style.animationDelay=.12*s+'s',n.style.opacity=.85,e.appendChild(n)})}function darkenColor(e,t){const s=parseInt(e.replace('#',''),16),n=Math.max(0,Math.min(255,(s>>16)-t)),i=Math.max(0,Math.min(255,((s>>8)&255)-t)),o=Math.max(0,Math.min(255,(65535&s)-t));return'#'+(1<<24|n<<16|i<<8|o).toString(16).slice(1)}function drawPrize(){const e=100*Math.random();let t=0;for(let s=0;s<prizes.length;s++)if(t+=prizes[s].probability,e<=t)return s;return prizes.length-1}function twist(){if(isTwisting)return;if(localStorage.getItem('hasDrawn')){showAlreadyDrawn();return}isTwisting=!0,document.getElementById('twistBtn').disabled=!0;const e=document.getElementById('knob'),t=document.getElementById('machine');e.classList.add('spin'),t.classList.add('shake'),setTimeout(()=>{e.classList.remove('spin'),t.classList.remove('shake');const s=document.getElementById('droppedCapsule'),n=drawPrize();s.style.background=`linear-gradient(135deg, ${capsuleColors[n%capsuleColors.length]}, ${darkenColor(capsuleColors[n%capsuleColors.length],20)})`,s.classList.add('drop'),setTimeout(()=>{document.getElementById('slotDoor').classList.add('open'),setTimeout(()=>{showResult(n),localStorage.setItem('hasDrawn','true'),localStorage.setItem('myPrize',JSON.stringify(prizes[n]))},700)},550)},600)}function showResult(e){const t=prizes[e],s=document.getElementById('capsuleBig'),n=document.getElementById('modalTitle'),i=document.getElementById('modalPrize'),o=document.getElementById('modalDesc');s.textContent='🥚',s.className='capsule-big',void s.offsetWidth,s.style.animation='capsuleShake .6s ease-in-out',n.textContent='打开扭蛋中…',i.textContent='',o.textContent='',document.getElementById('modalOverlay').classList.add('active'),setTimeout(()=>{s.classList.add('open'),setTimeout(()=>{document.getElementById('capsuleStage').innerHTML='<div class="prize-reveal">'+t.icon+'</div>',n.textContent='谢谢参与'===t.name?'哎呀～':'🎊 恭喜！',i.textContent=t.name,o.textContent='谢谢参与'===t.name?'别灰心，下次好运！':'请凭此页面联系工作人员领奖！','谢谢参与'!==t.name&&createConfetti()},500)},600)}function closeModal(){document.getElementById('modalOverlay').classList.remove('active'),showAlreadyDrawn()}function showAlreadyDrawn(){const e=localStorage.getItem('myPrize');e&&(document.getElementById('myPrizeText').textContent=JSON.parse(e).icon+' '+JSON.parse(e).name),document.getElementById('gameSection').classList.add('hidden'),document.getElementById('alreadyDrawn').classList.add('active')}function createConfetti(){const e=['#e74c3c','#f1c40f','#2ecc71','#3498db','#9b59b6','#e67e22','#1abc9c'];for(let t=0;t<80;t++)setTimeout(()=>{const s=document.createElement('div');s.className='confetti',s.style.left=100*Math.random()+'vw',s.style.background=e[Math.floor(7*Math.random())],s.style.animationDuration=2+2*Math.random()+'s',s.style.borderRadius=Math.random()>.5?'50%':'0',s.style.opacity=Math.random(),document.body.appendChild(s),setTimeout(()=>s.remove(),4e3)},25*t)}document.addEventListener('DOMContentLoaded',()=>{fillDome(),document.getElementById('twistBtn').addEventListener('click',twist),localStorage.getItem('hasDrawn')&&showAlreadyDrawn()});
  </script>
</body>
</html>
